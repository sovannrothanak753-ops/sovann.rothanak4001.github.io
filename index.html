<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ប្រព័ន្ធគ្រប់គ្រងទំនិញ និងបុគ្គលិក</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1b2b2a;--mute:#5f7170;--line:#d9e2e0;--accent:#0f6b5f;--accent-ink:#fff;--warn:#b45309;--danger:#b42318;--row:#f0f5f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1716;--card:#16211f;--ink:#e6efed;--mute:#93a8a5;--line:#2a3a38;--accent:#3fb8a5;--accent-ink:#06201c;--warn:#f0a050;--danger:#f08070;--row:#1b2927}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans Khmer",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:var(--accent);color:var(--accent-ink);padding:20px 16px 0}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:1.5rem;font-weight:800;margin:0 0 14px}
nav{display:flex;gap:4px}
nav button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--accent-ink);opacity:.75;padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:20px 16px 48px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:140px}
.stat b{display:block;font-size:1.35rem}
.stat span{color:var(--mute);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.bar input{width:auto}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.88rem;background:var(--row)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.act{text-align:right}
td.act .btn{padding:3px 10px;margin-left:4px;font-size:.88rem}
.low{color:var(--warn);font-weight:600}
.empty{padding:32px 16px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(480px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:.88rem;color:var(--mute)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.note{color:var(--mute);font-size:.85rem;margin-top:16px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}

body.locked header,body.locked main{display:none}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
body.locked #login{display:flex}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:min(380px,100%);text-align:center}
.lcard img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-bottom:8px}
.lcard h2{margin:0 0 4px;font-size:1.2rem}
.lcard p{margin:0 0 16px;color:var(--mute);font-size:.9rem}
.lcard label{text-align:left;margin-top:10px}
.lcard .btn{width:100%;margin-top:16px}
.err{color:var(--danger);font-size:.88rem;min-height:1.4em;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0}
.me{display:flex;align-items:center;gap:10px}
.me img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-ink)}
.me small{display:block;opacity:.8;line-height:1.2}
.me b{line-height:1.2}
.me .btn{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink);padding:4px 12px}
</style>
</head>
<body class="locked">
<section id="login"><form class="lcard" id="lform" autocomplete="on">
  <img id="lphoto" alt="រូបថតម្ចាស់ប្រព័ន្ធ">
  <h2>ចូលប្រើប្រព័ន្ធ</h2><p>សម្រាប់ម្ចាស់ប្រព័ន្ធ</p>
  <label for="lu">ឈ្មោះអ្នកប្រើ</label><input id="lu" autocomplete="username" required>
  <label for="lp">ពាក្យសម្ងាត់</label><input id="lp" type="password" autocomplete="current-password" required>
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn primary">ចូល</button>
</form></section>
<header><div class="wrap">
  <div class="top"><h1>ប្រព័ន្ធគ្រប់គ្រងទំនិញ និងបុគ្គលិក</h1>
    <div class="me"><img id="mphoto" alt="រូបថតម្ចាស់"><span><b id="mname"></b><small>ម្ចាស់ប្រព័ន្ធ (Owner)</small></span><button class="btn" id="logout" type="button">ចាកចេញ</button></div></div>
  <nav role="tablist">
    <button role="tab" id="t-products" aria-selected="true">ទំនិញ</button>
    <button role="tab" id="t-staff" aria-selected="false">បុគ្គលិក</button>
  </nav>
</div></header>

<main><div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="ស្វែងរក..." aria-label="ស្វែងរក">
    <button class="btn primary" id="add">+ បន្ថែម</button>
    <button class="btn" id="csv">ទាញយក CSV</button>
    <button class="btn" id="backup">បម្រុងទុក JSON</button>
    <button class="btn" id="restore">ស្តារទិន្នន័យ</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <div class="tbl"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  <p class="note">ទិន្នន័យត្រូវបានរក្សាទុកក្នុងកម្មវិធីរុករក (localStorage) នៃឧបករណ៍នេះ។ សូមបម្រុងទុក JSON ជាប្រចាំ។</p>
</div></main>

<dialog id="dlg"><form method="dialog" id="form"><h2 id="dt"></h2><div class="grid" id="fields"></div>
  <div class="foot"><button type="button" class="btn" id="cancel">បោះបង់</button><button class="btn primary" id="save" value="ok">រក្សាទុក</button></div>
</form></dialog>

<script>
const SCHEMA = {
  products: {
    title: 'ទំនិញ', key: 'sv_products',
    cols: [
      {k:'code', l:'លេខកូដ', req:1},
      {k:'name', l:'ឈ្មោះទំនិញ', req:1, full:1},
      {k:'category', l:'ប្រភេទ'},
      {k:'price', l:'តម្លៃ ($)', type:'number', num:1, fmt:v=>'$'+Number(v||0).toFixed(2)},
      {k:'qty', l:'ចំនួនក្នុងស្តុក', type:'number', num:1},
      {k:'note', l:'កំណត់ចំណាំ', full:1, hide:1}
    ]
  },
  staff: {
    title: 'បុគ្គលិក', key: 'sv_staff',
    cols: [
      {k:'id', l:'អត្តលេខ', req:1},
      {k:'name', l:'ឈ្មោះ', req:1},
      {k:'gender', l:'ភេទ', type:'select', opts:['ប្រុស','ស្រី']},
      {k:'position', l:'តួនាទី'},
      {k:'dept', l:'ផ្នែក'},
      {k:'phone', l:'លេខទូរស័ព្ទ', type:'tel'},
      {k:'email', l:'អ៊ីមែល', type:'email'},
      {k:'start', l:'ថ្ងៃចូលធ្វើការ', type:'date'},
      {k:'note', l:'កំណត់ចំណាំ', full:1, hide:1}
    ]
  }
};
const $ = id => document.getElementById(id);
let tab = 'products', editing = null;
const load = t => { try { return JSON.parse(localStorage.getItem(SCHEMA[t].key)) || []; } catch { return []; } };
const store = (t, d) => { try { localStorage.setItem(SCHEMA[t].key, JSON.stringify(d)); } catch { alert('មិនអាចរក្សាទុកទិន្នន័យបានទេ'); } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render() {
  const S = SCHEMA[tab], data = load(tab), q = $('q').value.trim().toLowerCase();
  const shown = cols => cols.filter(c => !c.hide);
  $('thead').innerHTML = '<tr>' + shown(S.cols).map(c => `<th class="${c.num?'num':''}">${c.l}</th>`).join('') + '<th></th></tr>';
  const rows = data.map((r, i) => ({r, i})).filter(({r}) => !q || Object.values(r).join(' ').toLowerCase().includes(q));
  $('tbody').innerHTML = rows.length ? rows.map(({r, i}) => '<tr>' + shown(S.cols).map(c => {
    let v = c.fmt ? c.fmt(r[c.k]) : esc(r[c.k]);
    const low = tab === 'products' && c.k === 'qty' && Number(r.qty) <= 5;
    return `<td class="${c.num?'num':''} ${low?'low':''}">${v}${low?' (ជិតអស់)':''}</td>`;
  }).join('') + `<td class="act"><button class="btn" data-e="${i}">កែ</button><button class="btn danger" data-d="${i}">លុប</button></td></tr>`).join('')
    : `<tr><td class="empty" colspan="${shown(S.cols).length+1}">${data.length ? 'រកមិនឃើញលទ្ធផល' : 'មិនទាន់មានទិន្នន័យ។ ចុច «+ បន្ថែម» ដើម្បីចាប់ផ្តើម។'}</td></tr>`;
  if (tab === 'products') {
    const val = data.reduce((s, r) => s + (+r.price || 0) * (+r.qty || 0), 0);
    const low = data.filter(r => +r.qty <= 5).length;
    $('stats').innerHTML = stat(data.length, 'ទំនិញសរុប') + stat('$' + val.toFixed(2), 'តម្លៃស្តុកសរុប') + stat(low, 'ជិតអស់ស្តុក');
  } else {
    const depts = new Set(data.map(r => r.dept).filter(Boolean)).size;
    $('stats').innerHTML = stat(data.length, 'បុគ្គលិកសរុប') + stat(depts, 'ផ្នែក');
  }
}
const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;

function openForm(i) {
  const S = SCHEMA[tab]; editing = i;
  const r = i === null ? {} : load(tab)[i];
  $('dt').textContent = (i === null ? 'បន្ថែម' : 'កែប្រែ') + S.title;
  $('fields').innerHTML = S.cols.map(c => {
    const v = esc(r[c.k] ?? ''), id = 'f_' + c.k, req = c.req ? 'required' : '';
    let el = c.type === 'select' ? `<select id="${id}"><option value="">—</option>${c.opts.map(o => `<option ${r[c.k]===o?'selected':''}>${o}</option>`).join('')}</select>`
      : c.k === 'note' ? `<textarea id="${id}" rows="2">${v}</textarea>`
      : `<input id="${id}" type="${c.type||'text'}" ${c.type==='number'?'min="0" step="any"':''} value="${v}" ${req}>`;
    return `<div class="${c.full?'full':''}"><label for="${id}">${c.l}${c.req?' *':''}</label>${el}</div>`;
  }).join('');
  $('dlg').showModal();
}

$('form').addEventListener('submit', e => {
  const S = SCHEMA[tab], data = load(tab), rec = {};
  S.cols.forEach(c => rec[c.k] = $('f_' + c.k).value.trim());
  const idk = S.cols[0].k;
  if (data.some((r, i) => i !== editing && r[idk] === rec[idk])) {
    e.preventDefault(); alert(S.cols[0].l + ' នេះមានរួចហើយ'); return;
  }
  editing === null ? data.push(rec) : data[editing] = rec;
  store(tab, data); render();
});
$('cancel').onclick = () => $('dlg').close();
$('add').onclick = () => openForm(null);
$('q').oninput = render;
$('tbody').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.e !== undefined) openForm(+b.dataset.e);
  if (b.dataset.d !== undefined && confirm('តើអ្នកចង់លុបមែនទេ?')) {
    const d = load(tab); d.splice(+b.dataset.d, 1); store(tab, d); render();
  }
};
function setTab(t) {
  tab = t; $('q').value = '';
  $('t-products').setAttribute('aria-selected', t === 'products');
  $('t-staff').setAttribute('aria-selected', t === 'staff');
  render();
}
$('t-products').onclick = () => setTab('products');
$('t-staff').onclick = () => setTab('staff');

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('csv').onclick = () => {
  const S = SCHEMA[tab], d = load(tab);
  const line = r => S.cols.map(c => '"' + String(r[c.k] ?? '').replace(/"/g, '""') + '"').join(',');
  const head = S.cols.map(c => '"' + c.l + '"').join(',');
  download(tab + '.csv', '\ufeff' + [head, ...d.map(line)].join('\n'), 'text/csv');
};
$('backup').onclick = () => download('backup-' + new Date().toISOString().slice(0, 10) + '.json',
  JSON.stringify({products: load('products'), staff: load('staff')}, null, 2), 'application/json');
$('restore').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.products) || !Array.isArray(j.staff)) throw 0;
    if (confirm('ទិន្នន័យបច្ចុប្បន្ននឹងត្រូវជំនួស។ បន្តទេ?')) { store('products', j.products); store('staff', j.staff); render(); }
  } catch { alert('ឯកសារមិនត្រឹមត្រូវ'); }
  e.target.value = '';
};

const OWNER_HASH='97166519b4cb765037abb19a14a1084299e5dc9ed8fcb4258a6e306b94e53d30';
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
$('lphoto').src=$('mphoto').src=OWNER_PHOTO;
function enter(u){$('mname').textContent=u;document.body.classList.remove('locked');}

$('lform').addEventListener('submit',async e=>{
  e.preventDefault();const u=$('lu').value.trim(),p=$('lp').value;
  if(await sha(u+':'+p)===OWNER_HASH){
    try{sessionStorage.setItem('sv_user',u);}catch{}

});
